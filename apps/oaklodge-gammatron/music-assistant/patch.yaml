---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
  namespace: default
spec:
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
    service:
      main:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/loadBalancerIPs: ${metallb_ip_music_assistant}
    persistence:
      data:
        existingClaim: music-assistant-data
        type: null
        accessMode: null
        size: null
      music:
        existingClaim: music-assistant-music
        globalMounts:
          - path: /media/music
            readOnly: true
